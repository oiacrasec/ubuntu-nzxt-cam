[package]
name = "nzxt-cam"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native NZXT CAM port for Ubuntu 24.04+: cooling, lighting and PC monitoring"
license = "MIT"

[features]
default = ["gui", "tray", "nvidia"]
gui = ["dep:eframe"]
tray = ["gui", "dep:ksni"]
nvidia = ["dep:nvml-wrapper"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"], optional = true }
nvml-wrapper = { version = "0.11", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "poll", "signal", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
